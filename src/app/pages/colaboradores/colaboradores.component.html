<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-primary mb-0">Colaboradores</h2>
                    <p class="text-muted small">Listado de colaboradores</p>
                </div>
               
                <button type="button" class="btn btn-primary"
                (click)="cargarColaboradores()">Cargar Colaboradores</button>
            </div>
            <table class="table">
                <thead>
                    <tr> 
                    <th scope="col">Nombres</th>
                    <th scope="col">Apellidos</th>
                    <th scope="col">Edad</th>
                    <th scope="col">Profesion</th>
                    <th scope="col">Estado Civil</th>
                    <th scope="col">Riesgo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let colaborador of colaboradores">
                        <td>
                            {{ colaborador.nombre }}
                        </td>
                        <td>
                            {{ colaborador.apellido }}
                        </td>
                        <td>
                            {{ colaborador.edad }}
                        </td>
                         <td>
                            {{ colaborador.profesion }}
                        </td>
                         <td>
                            {{ colaborador.estado_civil }}
                        </td>
                        <td>
                            <button type="button" class="btn btn-primary"
                            (click)="mostrarNivelRiesgo(colaborador.edad)"
                            >Nivel de Riesgo</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<ng-template #nivelRiesgoModal let-modal>
  <div class="modal-header bg-success text-white">
    <h4 class="modal-title">Nivel de Riesgo</h4> 
    <button type="button" class="btn-close" (click)="modal.close()"></button>
  </div>
   <div class="modal-content">
        <div class="modal-body">
            {{MensajeNivelRiesgo}}
        </div> 
    </div>
</ng-template>
